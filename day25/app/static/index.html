<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RAG Chat</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <p class="eyebrow">DAY 25 / CONVERSATIONAL RAG</p>
        <h1>RAG Chat</h1>
        <button id="new-chat" class="new-chat" type="button">+ Новый чат</button>
        <div class="side-heading"><span>Chats</span><button id="refresh-chats" class="text-button" type="button">Обновить</button></div>
        <nav id="chat-list" class="chat-list" aria-label="История чатов"></nav>
      </aside>

      <section class="workspace">
        <header class="workspace-header">
          <div>
            <p class="eyebrow">HISTORY + TASK MEMORY + SOURCES</p>
            <h2>Связный и проверяемый диалог</h2>
          </div>
          <p class="legend"><span class="dot"></span>Context is retrieved only in WITH RAG</p>
        </header>

        <form id="controls" class="controls">
          <fieldset>
            <legend>Mode</legend>
            <label><input type="radio" name="mode" value="with_rag" checked> WITH RAG</label>
            <label><input type="radio" name="mode" value="without_rag"> WITHOUT RAG</label>
          </fieldset>
          <fieldset id="retrieval-mode-control">
            <legend>Retrieval mode</legend>
            <label><input type="radio" name="retrieval_mode" value="baseline"> Baseline</label>
            <label><input type="radio" name="retrieval_mode" value="enhanced" checked> Enhanced</label>
          </fieldset>
          <label>Model
            <select id="model" name="model">
              <option value="deepseek-flash" selected>DeepSeek Flash</option>
              <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
            </select>
          </label>
          <label>Strategy
            <select id="strategy" name="strategy">
              <option value="structural" selected>Structural</option>
              <option value="fixed">Fixed</option>
            </select>
          </label>
          <label>Candidate Top-K
            <input id="candidate-top-k" name="candidate-top-k" type="number" value="15" min="1" max="20">
          </label>
          <label>Final Top-K
            <input id="final-top-k" name="final-top-k" type="number" value="5" min="1" max="20">
          </label>
        </form>

        <p id="status" class="status" aria-live="polite"></p>
        <details class="task-memory" open>
          <summary>Task Memory</summary>
          <div id="task-memory-content" class="task-memory-content"></div>
        </details>
        <section id="conversation" class="conversation" aria-live="polite">
          <div class="empty-state">Начните новый чат или выберите сохранённый. Каждый успешный WITH RAG ответ содержит источники и проверенные цитаты.</div>
        </section>

        <form id="question-form" class="composer">
          <label for="question">User</label>
          <textarea id="question" name="question" maxlength="1000" required placeholder="Как работает Weather MCP?"></textarea>
          <div class="composer-actions">
            <button id="send" type="submit">Отправить</button>
            <button id="compare" class="secondary" type="button">Сравнить RAG / без RAG</button>
            <button id="compare-retrieval" class="secondary" type="button">Сравнить Baseline / Enhanced</button>
          </div>
        </form>
      </section>
    </main>
    <template id="message-template">
      <article class="message">
        <div class="message-head"><strong class="role"></strong><span class="model"></span></div>
        <h3 class="answer-title">Answer</h3>
        <aside class="insufficient-context" hidden>
          <strong>Недостаточно информации</strong>
          <span>Retrieval не нашёл достаточно сильный контекст. Уточните вопрос или название компонента.</span>
        </aside>
        <div class="message-content"></div>
        <section class="sources-section" hidden><h3>Sources</h3><div class="sources"></div></section>
        <section class="quotes-section" hidden><h3>Quotes</h3><div class="quotes"></div></section>
        <details class="rag-details"><summary>RAG details</summary><div></div></details>
      </article>
    </template>
    <script src="/static/app.js"></script>
  </body>
</html>
